<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopi Kala Swara — Order & Kitchen Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          coffee: {
            50:  '#FBF6EF',
            100: '#F0E1CC',
            200: '#DDBFA0',
            300: '#C79A6E',
            400: '#A66F3F',
            500: '#7A4A2A',
            600: '#5C3A21',
            700: '#4A2E1B',
            800: '#3D2314',
            900: '#2A1810',
          },
          cream: {
            50:  '#FDF8F2',
            100: '#F8EFE2',
            200: '#F1E3CE',
          },
          amber: {
            50:  '#FEF6E9',
            100: '#FDECD1',
            300: '#F0B858',
            400: '#E8930A',
            500: '#D97706',
            600: '#B45F04',
            700: '#8F4A03',
          },
          char: {
            700: '#334155',
            800: '#1E293B',
            900: '#0F172A',
          },
        },
        fontFamily: {
          display: ['"Fraunces"', 'ui-serif', 'Georgia', 'serif'],
          body: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          soft: '0 2px 10px -2px rgba(61,35,20,0.10), 0 8px 24px -8px rgba(61,35,20,0.12)',
          softer: '0 1px 4px rgba(61,35,20,0.06)',
          lift: '0 12px 32px -8px rgba(61,35,20,0.22)',
        },
        keyframes: {
          steam: {
            '0%':   { transform: 'translateY(0) scaleX(1)', opacity: '0' },
            '15%':  { opacity: '.55' },
            '50%':  { transform: 'translateY(-9px) scaleX(1.15)', opacity: '.35' },
            '100%': { transform: 'translateY(-18px) scaleX(1.3)', opacity: '0' },
          },
          popin: {
            '0%':   { transform: 'scale(.94) translateY(6px)', opacity: '0' },
            '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
          },
          pulsedot: {
            '0%, 100%': { opacity: '1' },
            '50%': { opacity: '.35' },
          },
          slidein: {
            '0%': { transform: 'translateX(100%)' },
            '100%': { transform: 'translateX(0)' },
          },
        },
        animation: {
          steam1: 'steam 2.2s ease-in-out infinite',
          steam2: 'steam 2.2s ease-in-out .6s infinite',
          steam3: 'steam 2.2s ease-in-out 1.2s infinite',
          popin: 'popin .28s cubic-bezier(.2,.8,.2,1) both',
          pulsedot: 'pulsedot 1.6s ease-in-out infinite',
          slidein: 'slidein .3s cubic-bezier(.2,.8,.2,1) both',
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.js"></script>
</head>
<body class="bg-cream-50 text-coffee-900 antialiased">

<!-- Fallback tampil jika CDN gagal dimuat (mis. diblokir jaringan/ad-blocker) -->
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;color:#3D2314;">
    <div>
      <p style="font-size:14px;color:#A66F3F;margin-bottom:8px;">Kopi Kala Swara</p>
      <p style="font-size:15px;">Memuat aplikasi…</p>
      <p style="font-size:12px;color:#A66F3F;margin-top:16px;max-width:340px;">Jika halaman tetap seperti ini, koneksi ke CDN (jsdelivr.net / fonts.googleapis.com) mungkin diblokir oleh jaringan atau ad-blocker. Coba nonaktifkan ad-blocker atau buka di jaringan lain.</p>
    </div>
  </div>
</div>

<script>
  // Jika Vue gagal dimuat sama sekali (mis. CDN diblokir), tampilkan pesan yang jelas
  window.addEventListener('error', function (e) {
    if (!window.Vue) {
      var el = document.getElementById('app');
      if (el) {
        el.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;color:#3D2314;"><div><p style="font-size:16px;font-weight:700;margin-bottom:8px;">Gagal memuat aplikasi</p><p style="font-size:13px;max-width:360px;">Skrip dari CDN (Vue.js / Tailwind / Lucide) tidak berhasil dimuat. Ini biasanya karena tidak ada koneksi internet, atau CDN diblokir oleh firewall/ad-blocker. Silakan periksa koneksi Anda lalu muat ulang halaman.</p></div></div>';
      }
    }
  }, true);
</script>

<script src="js/app.js"></script>
</body>
</html>
